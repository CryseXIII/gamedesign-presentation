<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Design as Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=Press+Start+2P&family=VT323:wght@400&display=swap"
      rel="stylesheet"
    />
    <!-- Block browser context menu on the Phaser canvas before Phaser's own listener -->
    <script>
      document.addEventListener('contextmenu', function(e) {
        if (e.target && e.target.tagName === 'CANVAS') {
          e.preventDefault()
          e.stopImmediatePropagation()
        }
      }, true)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
